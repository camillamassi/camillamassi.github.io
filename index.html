<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C vs C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="titleScreen">
  <div class="invader-top" id="titleInvaderA"><div class="pixel-sprite" id="titleSpriteA"></div></div>
  <div class="title-row">
    <div class="title-logo">C vs C</div>
  </div>
  <button class="play-btn" id="playBtn">PLAY</button>
  <div class="insert-coin">&gt; INSERT COIN TO CONTINUE</div>
  <div class="invader-bottom" id="titleInvaderB"><div class="pixel-sprite" id="titleSpriteB"></div></div>
</div>

<div class="app hidden" id="mainApp">
  <h1>C vs C</h1>
  <div class="status" id="status">&gt; CONNESSIONE IN CORSO...</div>

  <div class="court pixel-frame">
    <div class="scoreboard">
      <div class="player player-a">
        <div class="sprite pixel-frame"><div class="pixel-sprite" id="spriteA"></div></div>
        <div class="player-name">CHATO</div>
        <div class="player-score" id="valueA">0</div>
        <div class="btn-row">
          <button id="minusA" disabled>−</button>
          <button class="plus" id="plusA" disabled>+</button>
        </div>
      </div>

      <div class="vs">VS</div>

      <div class="player player-b">
        <div class="sprite pixel-frame"><div class="pixel-sprite" id="spriteB"></div></div>
        <div class="player-name">CILLA</div>
        <div class="player-score" id="valueB">0</div>
        <div class="btn-row">
          <button id="minusB" disabled>−</button>
          <button class="plus" id="plusB" disabled>+</button>
        </div>
      </div>
    </div>

    <div class="verdict pixel-frame">
      <div class="verdict-label">CHI OFFRE DA BERE</div>
      <div class="verdict-value" id="diffValue">PAREGGIO</div>
      <div class="beer-icon" id="beerIcon"><div class="pixel-sprite" id="spriteBeer"></div></div>
    </div>
  </div>

  <div class="lives">
    <div class="heart-icon" id="heart1"><div class="pixel-sprite" id="heart1Sprite"></div></div>
    <div class="heart-icon" id="heart2"><div class="pixel-sprite" id="heart2Sprite"></div></div>
    <div class="heart-icon" id="heart3"><div class="pixel-sprite" id="heart3Sprite"></div></div>
  </div>
</div>

<script src="sprites.js"></script>
<script src="counters.js"></script>
</body>
</html>
